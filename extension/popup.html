<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .pet-preview {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: #ff9500;
            position: relative;
        }
        
        .pet-preview.cat::before,
        .pet-preview.cat::after {
            content: '';
            position: absolute;
            top: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 15px solid #ff9500;
        }
        
        .pet-preview.cat::before {
            left: 10px;
            transform: rotate(-20deg);
        }
        
        .pet-preview.cat::after {
            right: 10px;
            transform: rotate(20deg);
        }
        
        .mood-display {
            text-align: center;
            padding: 15px;
            background: #f0f8ff;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .mood-emoji {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .stats {
            margin-bottom: 15px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        
        .recommendations {
            background: #fff9c4;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .recommendations h4 {
            margin: 0 0 8px 0;
            color: #666;
        }
        
        .recommendations ul {
            margin: 0;
            padding-left: 20px;
        }
        
        .recommendations li {
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="pet-preview" class="pet-preview cat"></div>
        <h3>Focus Pet</h3>
    </div>
    
    <div id="loading" class="loading">
        Loading your pet data...
    </div>
    
    <div id="content" style="display: none;">
        <div class="mood-display">
            <div id="mood-emoji" class="mood-emoji">😊</div>
            <div id="mood-text">Happy</div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span>Session Time:</span>
                <span id="session-time">0h 0m</span>
            </div>
            <div class="stat-item">
                <span>Sites Visited:</span>
                <span id="sites-count">0</span>
            </div>
            <div class="stat-item">
                <span>Top Site:</span>
                <span id="top-site">None</span>
            </div>
        </div>
        
        <div class="recommendations">
            <h4>💡 Recommendations</h4>
            <ul id="recommendations-list">
                <li>Keep up the good work!</li>
            </ul>
        </div>
        
        <div class="actions">
            <button id="configure-btn" class="btn btn-primary">Configure</button>
            <button id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
